name: My Action
description: Action with I/O
inputs:
  name:
    description: The name to greet
    required: true
  greeting:
    description: The greeting
    default: Hello
outputs:
  result:
    description: The greeting result
runs:
  using: composite
  steps:
    - run: echo "$\{{ inputs.greeting }} $\{{ inputs.name }}"
      shell: bash
